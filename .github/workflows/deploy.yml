name: Deploy reviewed candidate (disabled)
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full main commit validated by complete Linux CI
        type: string
        required: true
      ci_run_id:
        description: Successful push/main CI run ID for this exact commit
        type: string
        required: true
      manifest_sha256:
        description: Independently reviewed release-manifest.json SHA-256
        type: string
        required: true
      confirmation:
        description: Type DEPLOY CARTE HESTA
        type: string
        required: true
      reopen:
        description: Restore an already-open public gate after private health checks (explicit approval)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cartehesta-production
  cancel-in-progress: false
jobs:
  prepare-only:
    if: ${{ false }} # Authorization required before removing this hard stop; GitHub workflow also stays disabled.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    outputs:
      archive_sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - name: Require explicit main-only authorization
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$GITHUB_REPOSITORY" = Daneisra/Carte-Hesta
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRMATION" = 'DEPLOY CARTE HESTA'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Verify exact complete Linux run and immutable artifact provenance
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          REVISION: ${{ inputs.revision }}
        run: node .github/scripts/verify-ci-run.cjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          repository: Daneisra/Carte-Hesta
          run-id: ${{ inputs.ci_run_id }}
          artifact-ids: ${{ steps.provenance.outputs.artifact_id }}
          path: ${{ runner.temp }}/reviewed-candidate
          merge-multiple: true
      - name: Verify release and prepare bounded code-only transport
        id: archive
        env:
          REVISION: ${{ inputs.revision }}
          EXPECTED_MANIFEST: ${{ inputs.manifest_sha256 }}
        run: |
          [[ "$EXPECTED_MANIFEST" =~ ^[a-f0-9]{64}$ ]]
          node tools/deployment.js verify "$RUNNER_TEMP/reviewed-candidate" "$REVISION" "$EXPECTED_MANIFEST"
          tar -C "$RUNNER_TEMP/reviewed-candidate" -cf "$RUNNER_TEMP/code.tar" app public ops release-manifest.json
          echo "sha256=$(sha256sum "$RUNNER_TEMP/code.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-transport-${{ github.sha }}
          path: ${{ runner.temp }}/code.tar
          if-no-files-found: error
          retention-days: 3
  # Transport is deliberately not provisioned by a source push. The server-side
  # restricted account/controller contract and activation checklist are in
  # docs/DEPLOY-MANUEL.md. Keep both stops until that separate authorization.
  activate-reviewed:
    if: ${{ false }}
    needs: prepare-only
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    environment: cartehesta-production
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reviewed-transport-${{ github.sha }}
          path: ${{ runner.temp }}/transport
      - name: Restricted SSH activation and external health with code-only rollback
        env:
          DEPLOY_HOST: ${{ vars.CARTE_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.CARTE_DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.CARTE_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.CARTE_DEPLOY_KNOWN_HOSTS }}
          REVISION: ${{ inputs.revision }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          ARCHIVE_SHA256: ${{ needs.prepare-only.outputs.archive_sha256 }}
          REOPEN: ${{ inputs.reopen && 'true' || 'false' }}
        run: python3 -I -B .github/scripts/transport-deploy.py
