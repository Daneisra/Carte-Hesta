# Proposal: confirm logrotate and PM2 reopen strategy in isolated Linux before installation.
/var/log/cartehesta/*.log /var/log/cartehesta/*.jsonl {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su cartehesta cartehesta
}
/var/log/cartehesta-nginx/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 www-data adm
    sharedscripts
    postrotate
        /usr/sbin/nginx -s reopen
    endscript
}
