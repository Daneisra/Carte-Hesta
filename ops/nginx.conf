# PROPOSAL, not installed. Validate certificates, installed Nginx and paths before nginx -t.
# Inside http{}; no wildcard root, alias, try_files, static fallback or public media directory.
log_format cartehesta_min '$time_iso8601 $status $request_method $body_bytes_sent';
server {
    listen 80;
    listen [::]:80;
    server_name cartehesta.dannytech.fr;
    if (!-f /run/cartehesta-gates/OPEN_APPROVED) { return 503; }
    return 308 https://cartehesta.dannytech.fr$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cartehesta.dannytech.fr;
    ssl_certificate /etc/letsencrypt/live/cartehesta.dannytech.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cartehesta.dannytech.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/cartehesta-nginx/access.log cartehesta_min;
    error_log /var/log/cartehesta-nginx/error.log warn;
    include /etc/nginx/snippets/cartehesta-routing.conf;
}
# Independent local recipe endpoint; not reachable from outside the host.
# It uses the SAME routing/ACL proxy rules and its own gate, never an IP bypass of maintenance.
server {
    listen 127.0.0.1:4181 ssl;
    ssl_certificate /etc/letsencrypt/live/cartehesta.dannytech.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cartehesta.dannytech.fr/privkey.pem;
    server_name localhost;
    access_log off;
    error_log /var/log/cartehesta-nginx/recipe-error.log warn;
    include /etc/nginx/snippets/cartehesta-recipe-routing.conf;
}
