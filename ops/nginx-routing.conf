# Included INSIDE both public and loopback server blocks. Node owns every resource decision.
root /srv/cartehesta/public;
autoindex off;
disable_symlinks on;
client_max_body_size 40m;
client_body_timeout 30s;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;
# Node supplies its existing CSP for HTML/resources. Do not replace it with a divergent policy.
# This flag is OUTSIDE public; absent flag is the fail-closed maintenance state.
if (!-f /run/cartehesta-gates/OPEN_APPROVED) { return 503; }
location ~ /\. { return 404; }
location ~* ^/(?:server(?:\.js|/|$)|tools(?:/|$)|tests(?:/|$)|node_modules(?:/|$)|data(?:/|$)|logs(?:/|$)|backups(?:/|$)|secrets(?:/|$)|\.git(?:/|$)) { return 404; }
location / {
    proxy_pass http://127.0.0.1:4173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering on;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 1h;
    proxy_send_timeout 60s;
    proxy_next_upstream off;
}
